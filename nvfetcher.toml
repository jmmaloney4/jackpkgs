# Prebuilt goreleaser binaries (CGO_ENABLED=0). Tags are vX.Y.Z; assets drop the v.
# src.prefix strips it so $ver matches gawkbot_$ver_<os>_<arch>.tar.gz.
[gawkbot-aarch64-darwin]
src.github = "najmuzzaman-mohammad/gawkbot"
src.prefix = "v"
fetch.url = "https://github.com/najmuzzaman-mohammad/gawkbot/releases/download/v$ver/gawkbot_$ver_darwin_arm64.tar.gz"

[gawkbot-aarch64-linux]
src.github = "najmuzzaman-mohammad/gawkbot"
src.prefix = "v"
fetch.url = "https://github.com/najmuzzaman-mohammad/gawkbot/releases/download/v$ver/gawkbot_$ver_linux_arm64.tar.gz"

[gawkbot-x86_64-darwin]
src.github = "najmuzzaman-mohammad/gawkbot"
src.prefix = "v"
fetch.url = "https://github.com/najmuzzaman-mohammad/gawkbot/releases/download/v$ver/gawkbot_$ver_darwin_amd64.tar.gz"

[gawkbot-x86_64-linux]
src.github = "najmuzzaman-mohammad/gawkbot"
src.prefix = "v"
fetch.url = "https://github.com/najmuzzaman-mohammad/gawkbot/releases/download/v$ver/gawkbot_$ver_linux_amd64.tar.gz"

[mcp-ynab]
src.git = "https://github.com/jmmaloney4/mcp-ynab"
fetch.github = "jmmaloney4/mcp-ynab"

[codex-proxy-rs]
src.git = "https://github.com/jmmaloney4/codex-proxy-rs"
fetch.github = "jmmaloney4/codex-proxy-rs"

# Tau Ceti: the worker CLI and the two engines it shells out to. The worker is packaged
# hermetically (see pkgs/tauceti), so the engines are real inputs rather than things `uvx`
# fetches at runtime.
[tauceti]
src.git = "https://github.com/TauCetiProject/TauCetiWorker"
fetch.github = "TauCetiProject/TauCetiWorker"

[tauceti-review]
src.git = "https://github.com/TauCetiProject/TauCetiReview"
fetch.github = "TauCetiProject/TauCetiReview"

# Pinned, not tracked: the worker nominates an exact TauCetiProgress revision in
# `tauceti_worker/constants.py:PROGRESS_REF`, and running any other revision would silently
# diverge from what every other worker runs. pkgs/tauceti asserts these two agree at build
# time, so bumping `tauceti` without bumping this fails the build instead of drifting.
[tauceti-progress]
src.manual = "e4cfa57193bd43827411e48f21226cc1c1b3b117"
fetch.github = "TauCetiProject/TauCetiProgress"
